<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Education Hub · 通识教育知识库</title>
  <meta name="description" content="面向终身学习的结构化通识教育知识库。">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
</head>
<body>
  <div id="app">加载中，请稍候…</div>
  <script>
    window.$docsify = {
      name: 'Education Hub',
      repo: 'https://github.com/frankwang98/education_hub',
      loadSidebar: true,
      // Sidebar links use paths rooted at this Hub. Keeping this false prevents
      // Docsify from re-resolving `docs/...` relative to a nested page.
      relativePath: false,
      subMaxLevel: 3,
      maxLevel: 4,
      auto2top: true,
      notFoundPage: true,
      search: {
        placeholder: '搜索知识',
        noData: '没有找到结果',
        depth: 3,
        maxAge: 86400000
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-markdown.min.js"></script>
</body>
</html>
